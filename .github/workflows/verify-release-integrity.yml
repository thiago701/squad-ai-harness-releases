name: Verify Public Release Integrity & InfoSec Homologation Suite

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Public Distribution Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Release Manifest, JSON Schema and Corporate InfoSec Homologation Suite
        run: |
          test -f manifests/releases/SHA256SUMS.txt
          test -f SECURITY.md
          test -f LICENSE.md
          test -f PRIVACY.md
          test -f docs/ROTEIRO_HOMOLOGACAO_SEGURANCA_CORPORATIVA.md
          test -f audit/Invoke-SquadAISecurityAudit.ps1
          test -f audit/verify-infosec-homologation.sh
          for f in manifests/releases/*.json enterprise-compliance/*.json enterprise-compliance/*/*.json; do
            jq empty "$f"
          done
          bash ./audit/verify-infosec-homologation.sh
